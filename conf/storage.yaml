# Профиль хранения для больших локальных экспериментов.
#
# Источник истины во время запуска — переменная окружения VKR_DATA_ROOT.
# В репозитории не храним абсолютный путь конкретного компьютера или диска.

default_data_root: .local_data
use_external_storage_by_default: false

# Если тяжёлые данные лежат на внешнем SSD, задайте путь перед запуском:
# export VKR_DATA_ROOT="/path/to/vkr_data"
