[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dem-vkr"
version = "0.1.0"
description = "Система построения и улучшения ЦМР (Sentinel-1, DEM, InSAR)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "pandas>=2.2",
    "rasterio>=1.3",
    "matplotlib>=3.8",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.10",
    "pyvista>=0.43",
    "trame-vtk>=2.8",
    "trame>=3.6",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "odc-stac>=0.3",
    "xarray>=2024.7",
    "rioxarray>=0.16",
    "boto3>=1.34",
    "earthaccess>=0.15",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8"]
ml = ["torch>=2.2", "segmentation-models-pytorch>=0.3.3"]
viz = ["streamlit>=1.30"]
